name: Post new stories to Telegram
on:
  schedule:
    - cron: '5 0,3,6,9,12,15 * * *'   # backup starts; each run keeps dripping (one post / ~40 min) for up to 5.5 h
  push:
    branches: [main]
    paths: [posts.json]
  workflow_dispatch:
    inputs:
      mode:
        description: "test = post the latest story once"
        default: test
permissions:
  contents: write
concurrency: {group: telegram, cancel-in-progress: false}
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          BEFORE: ${{ github.event.before }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'new' }}
        run: python3 .github/scripts/telegram_post.py
