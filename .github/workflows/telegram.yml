name: Post new stories to Telegram
on:
  schedule:
    - cron: '2,22,42 * * * *'   # drip: at most one post per run, 38+ min apart
  push:
    branches: [main]
    paths: [posts.json]
  workflow_dispatch:
    inputs:
      mode:
        description: "test = post the latest story once"
        default: test
permissions:
  contents: write
concurrency: {group: telegram, cancel-in-progress: false}
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          BEFORE: ${{ github.event.before }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'new' }}
        run: python3 .github/scripts/telegram_post.py
