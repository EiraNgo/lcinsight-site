name: Ping search engines (IndexNow)
on:
  push:
    branches: [main]
    paths: [posts.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Ping Bing, Yandex, Seznam, Naver via IndexNow (Bing feeds ChatGPT and Copilot search)
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.request
          KEY = "b6d4c1f0e2a94b3c8f7d5e6a1c2b3d4e"
          now = json.load(open("posts.json"))
          try:
              old = {p["slug"] for p in json.loads(subprocess.run(["git", "show", "HEAD~1:posts.json"], capture_output=True, text=True, check=True).stdout)}
          except Exception:
              old = set()
          urls = [p["url"] for p in now if p["slug"] not in old] or [p["url"] for p in now[:50]]
          urls = ["https://lcinsight.net/", "https://lcinsight.net/sitemap.xml"] + urls[:9000]
          body = json.dumps({"host": "lcinsight.net", "key": KEY, "keyLocation": f"https://lcinsight.net/{KEY}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r: print("IndexNow", r.status, len(urls), "URLs")
          except Exception as e:
              print("IndexNow error:", e, getattr(e, "read", lambda: b"")()[:300])
          PY
