  addEventListener('keydown',ev=>{if(sel&&!sel.isContentEditable&&(ev.key==='Delete'||ev.key==='Backspace')){const c=get(sel.dataset.k);hist.push([sel.dataset.k,JSON.stringify(c)]);

})();
